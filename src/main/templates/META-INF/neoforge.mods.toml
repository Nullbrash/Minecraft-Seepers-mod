modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# Optional Sodium integration: Sodium's config API loads this class by name, only when Sodium is installed.
[modproperties.${mod_id}]
"sodium:config_api_user" = "io.github.nullbrash.seepers.client.render.SodiumConfig"

# Client-only mixins go to the "client" list (package ...seepers.mixin.client).
[[mixins]]
config="${mod_id}.mixins.json"
# Optional Sodium integration (smooth dynamic light in its light pipelines): skipped when Sodium is absent.
[[mixins]]
config="${mod_id}.sodium.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
