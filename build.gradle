plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Run-only test mods — the same Modrinth files as in the Prism test instance.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' = present in dev runs only, never published as a dependency of the mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:emi:${emi_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Copies the built jar into the Prism test instance (path from the user-level property seepers.instanceDir).
// Values are captured as providers/locals so the task stays configuration-cache compatible.
def deployJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def deployInstanceDir = providers.gradleProperty('seepers.instanceDir')
tasks.register('deployToInstance') {
    group = 'seepers'
    description = 'Builds the mod jar and copies it into the mods folder of the Prism test instance.'
    inputs.file(deployJar)
    outputs.upToDateWhen { false }
    doLast {
        if (!deployInstanceDir.isPresent()) {
            throw new GradleException("Property 'seepers.instanceDir' is not set. Add it to %USERPROFILE%\\.gradle\\gradle.properties.")
        }
        def modsDir = new File(deployInstanceDir.get(), 'mods')
        if (!modsDir.isDirectory()) {
            throw new GradleException("Mods folder not found: ${modsDir}")
        }
        def jarFile = deployJar.get().asFile
        modsDir.listFiles().findAll { it.name ==~ /seepers-\d.*\.jar/ }.each { old ->
            // On Windows a running game keeps the jar locked.
            if (!old.delete()) {
                throw new GradleException("Cannot delete ${old} — close the game first.")
            }
        }
        java.nio.file.Files.copy(jarFile.toPath(), new File(modsDir, jarFile.name).toPath())
        println "Deployed ${jarFile.name} -> ${modsDir}"
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
