# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Personal settings (e.g. seepers.instanceDir — Prism test instance game dir used by deployToInstance)
# go to %USERPROFILE%\.gradle\gradle.properties, never here.

## Environment
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Must match the NeoForge version of the Prism test instance (update both together).
neo_version=21.1.264
loader_version_range=[1,)

## Run-only test mods (not dependencies of the mod). Keep in sync with the Prism test instance.
sodium_version=mc1.21.1-0.8.13-neoforge
emi_version=1.1.24+1.21.1+neoforge

## Mod
mod_id=seepers
mod_name=Seepers
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=io.github.nullbrash
mod_authors=NullBrash
mod_description=Horror survival in true darkness and living fog. You didn't fall. You seeped through.
